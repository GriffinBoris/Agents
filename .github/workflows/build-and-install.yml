name: Validate APM Package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  agent-flow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test Agent Flow
        run: |
          python -m pip install -e '.[dev]'
          ruff check src tests
          ruff format --check src tests
          pytest -q

      - name: Verify distributable project assets
        shell: bash
        run: |
          set -euo pipefail

          wheel_dir="$(mktemp -d)"
          project_dir="$(mktemp -d)"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          python -m pip install --force-reinstall "$wheel_dir"/*.whl
          agent-flow init --repo "$project_dir"
          agent-flow doctor --repo "$project_dir"
          test -f "$project_dir/.agents/skills/agent-flow/SKILL.md"
          test ! -L "$project_dir/.agents/skills/agent-flow/SKILL.md"
          test -f "$project_dir/.agents/workflows/agent-flow/deep-feature.yml"
          test -f "$project_dir/.agents/workflows/agent-flow/github-issue-to-pr.yml"
          test -f "$project_dir/.agent-flow/.gitignore"

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install and verify Agent Flow
        run: |
          python -m pip install -e '.[dev]'
          ruff check src tests
          ruff format --check src tests
          pytest -q

      - uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.28.0'

      - name: Validate authored primitives
        run: apm compile --validate --local-only

      - name: Verify self-contained aggregate migration baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f .apm/skills/migration-baseline/references/legacy-codex-AGENTS.md
          echo '2f1ea4481b85236a287645d2bcb83c626559d0060d961f8ea1bb0c1382744b43  .apm/skills/migration-baseline/references/legacy-codex-AGENTS.md' | shasum -a 256 --check
          test -s .apm/instructions/engineering-baseline.instructions.md
          test -s templates/project-baseline.txt
          test -s templates/project-architecture.md
          grep -Fq '# Agent Guidance' .apm/instructions/engineering-baseline.instructions.md
          grep -Fq 'Load `django-patterns`' .apm/instructions/engineering-baseline.instructions.md
          grep -Fq 'Load `django-testing`' .apm/instructions/engineering-baseline.instructions.md
          grep -Fq 'Load `vue-patterns`' .apm/instructions/engineering-baseline.instructions.md
          grep -Fq 'Load `vue-testing`' .apm/instructions/engineering-baseline.instructions.md
          grep -Fq 'Follow the consuming repository' .apm/instructions/engineering-baseline.instructions.md
          grep -Fq 'Load its `project-architecture`' .apm/instructions/engineering-baseline.instructions.md
          ! rg -n 'agents/(guidance|content|reference|agents_builder|build_agents|scripts|tools)' .apm/instructions .apm/skills --glob '!migration-baseline/references/legacy-codex-AGENTS.md'

      - name: Audit the package against its tracked release lockfile
        run: |
          test -f apm.lock.yaml
          apm audit

      - name: Install source package into every declared harness fixture
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$(mktemp -d)/agents-source"
          consumer_dir="$(mktemp -d)/agents-consumer"
          mkdir "$source_dir" "$consumer_dir"
          git archive HEAD | tar -x -C "$source_dir"
          cd "$consumer_dir"

          targets="claude,codex,opencode,copilot,gemini"
          apm init --yes --target "$targets"
          mkdir -p .apm/skills/project-architecture
          cp "$source_dir/templates/project-architecture.md" .apm/skills/project-architecture/SKILL.md
          apm install "$source_dir" --target "$targets"
          apm compile --target "$targets"

          test -f .claude/skills/django-patterns/SKILL.md
          test -f .claude/skills/django-testing/SKILL.md
          test -f .claude/skills/django-testing/references/testing.md
          test -f .claude/skills/django-testing/references/examples/django-view-tests.md
          test -f .claude/skills/vue-testing/SKILL.md
          test -f .claude/skills/vue-testing/references/testing.md
          test -f .claude/skills/integration-boundaries/SKILL.md
          test -f .claude/skills/project-architecture/SKILL.md
          test -f .claude/skills/ste-writing/references/plain-technical-writing.md
          for skill in full-review guidance-review review-git-diff push-guidance-to-agents; do
            test -f ".claude/skills/$skill/SKILL.md"
          done
          test -f .claude/rules/engineering-baseline.md
          test ! -e .claude/rules/project-baseline.md
          grep -Fq 'Never commit secrets or credentials.' .claude/rules/engineering-baseline.md
          test -f .agents/skills/django-patterns/SKILL.md
          test -f .agents/skills/django-testing/SKILL.md
          test -f .agents/skills/django-testing/references/testing.md
          test -f .agents/skills/django-testing/references/examples/django-view-tests.md
          test -f .agents/skills/vue-testing/SKILL.md
          test -f .agents/skills/vue-testing/references/testing.md
          grep -Fq 'production-code implementation conventions' .agents/skills/django-patterns/SKILL.md
          grep -Fq 'behavior-focused unit and integration tests' .agents/skills/django-testing/SKILL.md
          grep -Fq 'production-code implementation conventions' .agents/skills/vue-patterns/SKILL.md
          grep -Fq 'behavior-focused unit, component, and end-to-end tests' .agents/skills/vue-testing/SKILL.md
          test -f .agents/skills/integration-boundaries/SKILL.md
          test -f .agents/skills/project-architecture/SKILL.md
          test -f .agents/skills/ste-writing/references/strict-controlled-writing.md
          for skill in full-review guidance-review review-git-diff push-guidance-to-agents; do
            test -f ".agents/skills/$skill/SKILL.md"
          done
          test -f .agents/skills/django-patterns/references/examples/django-view.md
          test ! -e .agents/skills/django-patterns/references/testing.md
          test ! -e .agents/skills/django-patterns/references/examples/django-view-tests.md
          test -f .agents/skills/migration-baseline/references/legacy-codex-AGENTS.md
          grep -Fq '# Agent Guidance' .agents/skills/migration-baseline/references/legacy-codex-AGENTS.md
          test -f .github/copilot-instructions.md
          test -f .github/instructions/engineering-baseline.instructions.md
          test ! -e .github/instructions/project-baseline.instructions.md
          grep -Fq 'Never commit secrets or credentials.' .github/instructions/engineering-baseline.instructions.md
          test -f GEMINI.md
          grep -Fq '@./AGENTS.md' GEMINI.md
          test -f AGENTS.md
          grep -Fq '# Agent Guidance' AGENTS.md
          ! grep -Fq '# Project Essentials' AGENTS.md
          grep -Fq 'Never commit secrets or credentials.' AGENTS.md
          grep -Fq 'Load `integration-boundaries`' AGENTS.md
          grep -Fq 'Load `ste-writing`' AGENTS.md
          ! grep -Fq '# Django Guidance' AGENTS.md
          ! grep -Fq '# Project Architecture' AGENTS.md
          ! grep -Fq 'agents/guidance/' AGENTS.md
