name: GitHub Settings

on:
  pull_request:
    paths:
      - '.github/repository-settings.yml'
      - '.github/rulesets/**'
      - '.github/workflows/github-settings.yml'
      - 'agents/github_settings/**'
      - 'agents/manage_github_settings.py'
      - 'pyproject.toml'
      - 'tests/test_github_settings.py'
  push:
    branches:
      - main
    paths:
      - '.github/repository-settings.yml'
      - '.github/rulesets/**'
      - '.github/workflows/github-settings.yml'
      - 'agents/github_settings/**'
      - 'agents/manage_github_settings.py'
      - 'pyproject.toml'
      - 'tests/test_github_settings.py'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install GitHub settings tooling
        run: python -m pip install --editable '.[github-settings]'

      - name: Validate checked-in settings
        run: agents-github-settings validate

      - name: Run GitHub settings tests
        run: python -m unittest discover -s tests -p 'test_github_settings.py'
