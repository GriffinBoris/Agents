[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-flow-runner"
version = "0.1.0"
description = "A file-backed controller for Codex Desktop-native agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Griffin Boris" }]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
agent-flow = "agent_flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_flow"]

[tool.hatch.build.targets.wheel.force-include]
".apm/skills/agent-flow" = "agent_flow/resources/skill"
"examples/agent-flow/deep-feature.yml" = "agent_flow/resources/workflows/deep-feature.yml"
"examples/agent-flow/github-issue-to-pr.yml" = "agent_flow/resources/workflows/github-issue-to-pr.yml"
"templates/agent-flow.gitignore" = "agent_flow/resources/project.gitignore"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"
