# The canonical resource spec.
#
# Everything not declared here is derived from the repository guidance examples:
# verbose names, choice labels, related names, route names, admin configuration,
# serializer field tuples, and the permission test matrix.

app: item
model: Item
scope: catalog_entry

choices:
  status:
    - ACTIVE
    - INACTIVE

fields:
  catalog_entry: fk catalog_entry.CatalogEntry
  name: text
  code: text
  status: choice status
  summary: text blank
  sort_order: positive_int default=0

unique:
  - catalog_entry
  - code

filters:
  - search=name
  - status

actions:
  archive: status=INACTIVE
